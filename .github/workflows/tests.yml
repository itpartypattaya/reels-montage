name: tests

# Text that no test reads (READMEs, the changelog, LICENSE, docs images) skips these jobs;
# release-checks.yml still checks it. SKILL.md and references/ are read by the tests, so they are not listed.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/README.md"
      - "**/README.*.md"
      - "**/CHANGELOG.md"
      - "LICENSE"
      - "docs/**"
      - "docs-src/**"
  pull_request:
    paths-ignore:
      - "**/README.md"
      - "**/README.*.md"
      - "**/CHANGELOG.md"
      - "LICENSE"
      - "docs/**"
      - "docs-src/**"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request cancels the run it replaces; runs on main always finish.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: scripts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the slowest runner: pull requests skip it, main and a manual run (workflow_dispatch) include it.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
        python: ["3.12"]
        include:
          # 24.04: ubuntu-latest moved to 26.04, which has no Python 3.9 build
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install Python packages
        run: python -m pip install -r tests/requirements.txt
      - name: Run the script tests
        # One worker per CPU core; --durations lists the slowest tests for the next round of speed-ups.
        run: python -m pytest tests/scripts -q -n auto --durations=15

  remotion-kit:
    name: remotion kit (starter project, npm install, tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Create the starter project
        run: python plugins/it-reelsmaker/skills/it-reelsmaker/scripts/kit.py new "$RUNNER_TEMP/reels"
      - name: Install the pinned packages
        working-directory: ${{ runner.temp }}/reels
        run: npm install --no-audit --no-fund
      - name: Type-check the kit
        working-directory: ${{ runner.temp }}/reels
        run: npx tsc
