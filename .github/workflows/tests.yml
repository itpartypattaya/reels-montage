name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: scripts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install Python packages
        run: python -m pip install pytest Pillow numpy
      - name: Run the script tests
        run: python -m pytest tests/scripts -q

  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Directory rules (sizes, Cyrillic, providers and network in the core)
        run: python tools/check_release.py

  remotion-kit:
    name: remotion kit (starter project, npm install, tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Create the starter project
        run: python plugins/it-reelsmaker/skills/it-reelsmaker/scripts/kit.py new "$RUNNER_TEMP/reels"
      - name: Install the pinned packages
        working-directory: ${{ runner.temp }}/reels
        run: npm install --no-audit --no-fund
      - name: Type-check the kit
        working-directory: ${{ runner.temp }}/reels
        run: npx tsc
